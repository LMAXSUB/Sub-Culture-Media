<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sub Culture community chat">
  <title>Chat — Sub Culture</title>
  <link rel="icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Sub Culture home">
        <img src="logo.svg" alt="Sub Culture">
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <a href="index.html">Articles</a>
        <a href="photography.html">Photo &amp; Video</a>
        <a href="downloads.html">Downloads</a>
        <a href="trivia.html">Daily Trivia</a>
        <a href="index.html#live-scores">Live Scores</a>
        <a class="nav-chat active" href="chat.html">Chat</a>
      </nav>
      <div class="header-socials" aria-label="Social links">
        <a href="https://instagram.com/subxculturex" target="_blank" rel="noopener">IG</a>
        <a href="https://tiktok.com/@subxculturex" target="_blank" rel="noopener">TT</a>
        <a href="https://youtube.com/@subxculturex" target="_blank" rel="noopener">YT</a>
      </div>
    </div>
  </header>

  <main class="chat-page">
    <section class="chat-shell" aria-label="Sub Culture Chat">
      <aside class="chat-sidebar">
        <div class="chat-brand-row">
          <div>
            <span class="eyebrow">SUB CULTURE</span>
            <h1>Community Chat</h1>
          </div>
          <span id="connection-status" class="status-pill offline">OFFLINE</span>
        </div>

        <div class="profile-card">
          <label for="username">Your name</label>
          <div class="profile-edit">
            <input id="username" maxlength="24" autocomplete="nickname" placeholder="Enter your name">
            <button id="save-name" type="button">Save</button>
          </div>
          <p class="small-note">Your display name is stored only in this browser.</p>
        </div>

        <div class="members-head">
          <h2>Online</h2>
          <span id="member-count">0</span>
        </div>
        <div id="members" class="members" aria-live="polite"></div>
      </aside>

      <section class="chat-main">
        <div class="chat-topbar">
          <div>
            <span class="eyebrow">LIVE ROOM</span>
            <h2>Sub Culture Lounge</h2>
          </div>
          <div class="call-actions">
            <button id="audio-call" class="icon-button" type="button" title="Start voice call">☎ <span>Voice</span></button>
            <button id="video-call" class="icon-button primary" type="button" title="Start video call">▣ <span>Video</span></button>
          </div>
        </div>

        <div id="call-panel" class="call-panel" hidden>
          <div class="call-header">
            <strong id="call-title">Call</strong>
            <button id="end-call" type="button" class="danger-button">End call</button>
          </div>
          <div id="videos" class="videos">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay muted playsinline></video>
            <div id="audio-only-label" class="audio-only-label" hidden>VOICE CALL</div>
          </div>
          <div class="call-controls">
            <button id="mute-mic" type="button">Mute mic</button>
            <button id="toggle-camera" type="button">Camera off</button>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="message-form" class="message-form" autocomplete="off">
          <input id="message-input" maxlength="1000" placeholder="Write a message…" aria-label="Message">
          <button type="submit" class="send-button">Send</button>
        </form>
        <p id="chat-error" class="chat-error" role="alert"></p>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© <span id="year"></span> Sub Culture Media</p>
      <a href="index.html">Back to Sub Culture</a>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="chat.js"></script>
</body>
</html>
